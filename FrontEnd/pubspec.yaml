# "name" tetap tugas_akhir: ini nama paket Dart (dipakai di import package:tugas_akhir/...),
# bukan nama yang tampil di HP. Nama di HP diatur di AndroidManifest.xml (PosyanduCare).
name: tugas_akhir
description: "PosyanduCare - Aplikasi pemantauan tumbuh kembang balita di Posyandu."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  provider: ^6.1.5+1
  http: ^1.6.0
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.4.2
  image_picker: ^1.1.2
  google_fonts: ^6.3.2
  # Kartu antrean: simpan tiket ke galeri & bagikan ke WhatsApp
  gal: ^2.3.1
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  # Laporan bulanan: buat PDF, unduh/cetak
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Membuat ikon aplikasi (Android, iOS, web) dari logo.png
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - logo.png
    - buku_panduan.png
    - data_keluarga.png
    - grafik_anak.png
    - pendaftaran.png
    - hasil_pemeriksaan.png
    - vaksin_anak.png
    - rekap_posyandu.png
    - data_master.png
    - antropometri.png
    - deteksi_dini.png
    - imunisasi.png
    - jadwal.png
    - kelola_akun.png
    - pengumuman.png
    - qr_chekin.png
    - rekap_skdn.png
    - riwatar_pemeriksaan.png
    - semua_balita.png
    - surat_rujukan.png
    - ukur_data.png
    - vitamin_pmt.png
    - assets/standar_antropometri.csv

  uses-material-design: true

# ---------------------------------------------------------------------------
# IKON APLIKASI POSYANDUCARE (logo sama dengan halaman login)
# Jalankan: dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "logo.png"

  # Android: menimpa ic_launcher bawaan Flutter.
  android: true
  min_sdk_android: 21
  # Ikon adaptif Android 8+: latar hijau PosyanduCare + logo di depannya.
  adaptive_icon_background: "#065F46"
  adaptive_icon_foreground: "logo.png"

  # iOS: ikon tidak boleh transparan, jadi diberi latar hijau.
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#065F46"

  # Web: favicon dan ikon PWA.
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#065F46"
    theme_color: "#065F46"